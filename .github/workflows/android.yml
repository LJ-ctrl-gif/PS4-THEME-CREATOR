name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android platform files
        run: flutter create --project-name ps4_theme_creator --platforms=android .
      - name: Add Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '    <application'
          permissions = '    <uses-permission android:name="android.permission.INTERNET" />' + chr(10) + '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' + chr(10)
          if "android.permission.INTERNET" not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps4-theme-creator-android
          path: build/app/outputs/flutter-apk/app-release.apk
